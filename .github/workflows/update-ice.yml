name: Update Plymouth ice

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-plymouth:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Fetch Plymouth ice
        run: |
          mkdir -p data/plymouth
          python plymouth_ingest.py \
            --date 2026-09-08 \
            --min-minutes 60 \
            --out data/plymouth/test.json

      - name: Commit updated ice data
        run: |
          git config user.name "SportsSpace Ice Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/plymouth

          if git diff --cached --quiet; then
            echo "No changes to save."
            exit 0
          fi

          git commit -m "Update Plymouth ice availability"
          git push
